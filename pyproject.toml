[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trival"
version = "0.1.0"
description = "TRIVAL: Thematic Review with Inbuilt Validation. A two-stage decision support framework for computational literature review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rahul", email = "rahul235@gmail.com" }
]

[project.scripts]
trival-stage1 = "scripts.run_stage1:main"
trival-stage2-themes = "scripts.run_stage2_themes:main"
trival-stage2-methods = "scripts.run_stage2_methods:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
